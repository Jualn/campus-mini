<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      .head {
        fill: #DDEEFF;
        stroke: #1677FF;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-miterlimit: 10;
      }
      .shoulder {
        fill: none;
        stroke: #1677FF;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-miterlimit: 10;
      }
    </style>
  </defs>
  <!-- 头部：浅蓝填充 + 蓝色描边 -->
  <circle class="head" cx="12" cy="8" r="4.5"/>
  <!-- 肩膀弧线：蓝色加粗 -->
  <path class="shoulder" d="M11.88,12.67a7.74,7.74,0,0,1,8.29,7.5"/>
  <path class="shoulder" d="M12,12.67a7.74,7.74,0,0,0-8.29,7.5"/>
</svg>